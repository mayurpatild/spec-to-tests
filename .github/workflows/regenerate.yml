# Nightly: re-read the public Petstore spec; if it changed, regenerate tests with Claude,
# run them, and open a PR with the diff and COVERAGE.md. Unchanged spec = no commit.
name: regenerate
on:
  schedule: [{ cron: '15 2 * * 1-5' }]
  workflow_dispatch:
    inputs:
      force: { type: boolean, default: false, description: 'Regenerate even if the spec hash is unchanged' }
permissions:
  contents: write
  pull-requests: write
jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Generate
        run: npx tsx src/cli.ts generate --spec https://petstore3.swagger.io/api/v3/openapi.json --out tests/generated --tags pet,store ${{ inputs.force && '--force' || '' }}
      - name: Typecheck generated tests
        run: npx tsc --noEmit -p tsconfig.tests.json
      - run: npx playwright install --with-deps chromium
      - name: Run
        run: npx playwright test tests/generated || true
      - name: Open PR if anything changed
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: 'chore: regenerate tests for updated Petstore spec'
          title: 'Regenerated API tests (spec changed)'
          body: 'The upstream OpenAPI spec changed. Tests and COVERAGE.md were regenerated by Claude; review the diff before merging.'
          branch: regen/petstore
          delete-branch: true
